name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # prisma.config.ts resolves env("DATABASE_URL") eagerly, so the variable
        # must be present. No connection is made — any syntactically valid URL works.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run build

  client:
    name: Client — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (runs tsc -b, then vite build)
        run: npm run build

      - name: Lint
        # Non-blocking: the repository has 71 pre-existing
        # @typescript-eslint/no-explicit-any errors. Clearing those is a
        # refactor in its own right; until then lint reports without gating
        # merges. Flip to a blocking step once the backlog is cleared.
        continue-on-error: true
        run: npm run lint

  tests:
    name: Tests — E2E suite static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile-check the suite
        # -W error::SyntaxWarning catches `return` inside `finally`, which
        # silently discarded real exceptions and turned every failure into an
        # undiagnosable "TEST FAILED" (finding H5).
        run: python -W error::SyntaxWarning -m compileall -q .

      - name: Assert no hardcoded credentials or production targets
        # Guards finding C3 against regression. Credentials must come from the
        # environment and the default target must never be production.
        run: |
          if grep -rnE "TestPassword|test@example\.com|pump-client\.vercel\.app|pump-api\.onrender\.com" --include='*.py' .; then
            echo "::error::Hardcoded credential or production URL found in tests/"
            exit 1
          fi
          echo "OK: no hardcoded credentials or production URLs"

      - name: Assert credentials are required, not defaulted
        run: |
          set +e
          output=$(python run_all_tests.py 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 2 ]; then
            echo "::error::Expected exit 2 when credentials are absent, got $status"
            exit 1
          fi
          echo "OK: suite refuses to run without PUMP_TEST_EMAIL/PUMP_TEST_PASSWORD"

  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pump
          POSTGRES_PASSWORD: pump
          POSTGRES_DB: pump_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pump -d pump_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://pump:pump@localhost:5432/pump_test
      JWT_SECRET: ci-integration-test-secret-at-least-32-chars
      CLIENT_URL: http://localhost:5173
      PORT: '5000'
      NODE_ENV: test
      # Registering several users per run would trip the 5/15min auth limiter.
      # Only honoured when NODE_ENV !== 'production'.
      DISABLE_RATE_LIMIT: 'true'
      PUMP_API_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        # `npm run build` is `prisma generate && tsc`. The generate is the
        # important part: `npm ci` installs @prisma/client WITHOUT generated
        # output, and `prisma db push` does NOT generate it either. Without
        # this step the server died instantly on
        #   src/prisma.ts(1,10): error TS2305: Module '"@prisma/client"' has
        #   no exported member 'PrismaClient'
        # which surfaced only as 60s of connection-refused in the test step.
        #
        # Running the compiled dist/ output also means CI exercises the same
        # artifact production runs (`npm start` -> node dist/app.js), and boots
        # in ~3s instead of paying ts-node's type-check on every start.
        run: npm run build

      - name: Show database version
        # Recorded so a Postgres-version question can be answered from the log
        # rather than guessed at. The service is postgres:16-alpine; local
        # verification used 18.
        run: |
          PGPASSWORD=pump psql -h localhost -U pump -d pump_test -c 'SELECT version();' \
            || echo "psql unavailable on the runner - continuing (non-fatal)"

      - name: Apply schema
        working-directory: server
        # Note: db push does NOT regenerate the Prisma client. See "Build server".
        run: npx prisma db push --accept-data-loss

      - name: Seed exercise library
        working-directory: server
        run: node prisma/seed.js

      - name: Install test dependencies
        working-directory: tests
        run: pip install -r requirements.txt

      - name: Start API server and wait for readiness
        working-directory: server
        # Fails in seconds if the process dies, instead of letting the test
        # step wait out a 60s timeout and report a bare connection error.
        run: |
          node dist/app.js > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > "$RUNNER_TEMP/server.pid"
          echo "server pid: $SERVER_PID"

          for i in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::server process exited after ${i}s - see the server log step below"
              exit 1
            fi
            if curl -fsS -m 2 http://localhost:5000/ >/dev/null 2>&1; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::server did not answer on http://localhost:5000/ within 60s"
          exit 1

      - name: Run API integration tests
        working-directory: tests/api
        # Includes test_cross_user_authorization.py, the suite that stands in
        # for the absent database-level isolation (RLS is inert - see AUDIT.md
        # C1).
        run: |
          # Liveness re-check: turns "the server died between steps" into an
          # immediate, named failure rather than 60s of connection refused.
          if ! curl -fsS -m 5 http://localhost:5000/ >/dev/null; then
            echo "::error::server is no longer reachable at the start of the test step"
            exit 1
          fi
          python -m pytest -v

      - name: Server log
        # Always, not just on failure: a passing run's log is what you compare
        # against when a later run breaks.
        if: always()
        run: |
          echo "----- server stdout/stderr -----"
          cat "$RUNNER_TEMP/server.log" 2>/dev/null || echo "(no server log was produced)"
          echo "----- end of server log -----"

# NOTE: the browser-driven Selenium tests are not run here. They need a
# deployed target plus real account credentials, so they live in e2e.yml
# (manual / scheduled, gated on repository secrets).
