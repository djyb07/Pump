name: Keep Azure Server Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Azure Backend
        run: |
          echo "Pinging Azure App Service to keep it alive..."
          curl -s -o /dev/null -w "Status: %{http_code}\n" https://pump-server-ghhkhhggb7dfaegx.israelcentral-01.azurewebsites.net/api/health/db || true
          echo "Ping completed at $(date)"
