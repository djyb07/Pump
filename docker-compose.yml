# Local Postgres for the API integration tests (tests/api).
#
#   docker compose up -d db
#   cd server && DATABASE_URL=postgresql://pump:pump@localhost:5433/pump_test npx prisma db push
#   npx prisma db execute --file prisma/seed.sql --schema prisma/schema.prisma
#
# Port 5433 to avoid clashing with a local Postgres on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pump
      POSTGRES_PASSWORD: pump
      POSTGRES_DB: pump_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pump -d pump_test']
      interval: 3s
      timeout: 3s
      retries: 20
